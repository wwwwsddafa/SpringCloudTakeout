<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 30px auto; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
        .header { background: linear-gradient(135deg, #4a90d9, #357abd); padding: 30px; text-align: center; color: #fff; }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 8px 0 0; opacity: 0.9; font-size: 14px; }
        .body { padding: 30px; }
        .body h2 { color: #333; font-size: 20px; margin-top: 0; }
        .body p { color: #666; line-height: 1.8; font-size: 15px; }
        .alert-box { background: #fff3e0; border-left: 4px solid #ff9800; padding: 16px 20px; margin: 20px 0; border-radius: 0 8px 8px 0; }
        .footer { background: #fafafa; padding: 20px; text-align: center; color: #999; font-size: 12px; }
        .footer p { margin: 4px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>登录安全提醒</h1>
            <p>账号安全通知</p>
        </div>
        <div class="body">
            <h2>Hi, {username}</h2>
            <p>你的账号刚刚进行了一次登录操作。</p>
            <div class="alert-box">
                <p style="margin:0; color:#ff9800;"><strong>登录时间：</strong>{datetime}</p>
                <p style="margin:8px 0 0; color:#ff9800;"><strong>登录IP：</strong>{loginIp}</p>
            </div>
            <p>如果这不是你本人的操作，请立即修改密码并联系客服。</p>
        </div>
        <div class="footer">
            <p>外卖点餐平台</p>
            <p>这是一封系统自动发送的邮件，请勿回复。</p>
        </div>
    </div>
</body>
</html>
