<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>运营数据报告</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f5f5f5;">
    <div style="max-width: 600px; margin: 0 auto; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        <div style="background: #1890ff; padding: 20px; text-align: center;">
            <h1 style="color: #fff; margin: 0; font-size: 22px;">当日运营报告</h1>
        </div>
        <div style="padding: 30px;">
            <p style="font-size: 14px; color: #333;">{username}，您好！</p>
            <p style="font-size: 14px; color: #333;">日期：<strong>{date}</strong></p>
            <p style="font-size: 14px; color: #333;">请查收附件中的当日运营数据汇总：</p>
            <ul style="font-size: 14px; color: #555; line-height: 2;">
                <li><strong>当日成交情况汇总.pdf</strong> — 订单概览、商品销售额排行 Top10</li>
                <li><strong>当日运营情况汇总.xlsx</strong> — 包含运营概览、流量分析、商品排行、订单分析、用户分析、时段趋势、设备分布 7 个 Sheet</li>
            </ul>
            <div style="border-top: 1px solid #eee; margin-top: 20px; padding-top: 20px;">
                <p style="font-size: 12px; color: #999;">此为系统自动生成报告，请勿回复。</p>
                <p style="font-size: 12px; color: #999;">发送时间：{datetime}</p>
            </div>
        </div>
    </div>
</body>
</html>
