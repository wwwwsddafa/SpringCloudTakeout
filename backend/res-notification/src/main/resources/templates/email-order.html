<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 30px auto; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
        .header { background: linear-gradient(135deg, #43a047, #2e7d32); padding: 30px; text-align: center; color: #fff; }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 8px 0 0; opacity: 0.9; font-size: 14px; }
        .body { padding: 30px; }
        .body h2 { color: #333; font-size: 20px; margin-top: 0; }
        .body p { color: #666; line-height: 1.8; font-size: 15px; }
        .order-box { background: #f1f8e9; border-left: 4px solid #43a047; padding: 16px 20px; margin: 20px 0; border-radius: 0 8px 8px 0; }
        .order-box p { margin: 6px 0; }
        .footer { background: #fafafa; padding: 20px; text-align: center; color: #999; font-size: 12px; }
        .footer p { margin: 4px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>订单已生成</h1>
            <p>下单成功通知</p>
        </div>
        <div class="body">
            <h2>Hi, {username}</h2>
            <p>你的订单已生成，请尽快完成支付。</p>
            <div class="order-box">
                <p><strong>订单编号：</strong>{roid}</p>
                <p><strong>下单时间：</strong>{datetime}</p>
                <p><strong>订单金额：</strong>¥{totalPrice}</p>
                <p><strong>配送地址：</strong>{address}</p>
                <p><strong>支付方式：</strong>{payment}</p>
            </div>
            <p>订单正在等待支付，请及时完成支付以免订单过期。</p>
        </div>
        <div class="footer">
            <p>外卖点餐平台</p>
            <p>这是一封系统自动发送的邮件，请勿回复。</p>
        </div>
    </div>
</body>
</html>
