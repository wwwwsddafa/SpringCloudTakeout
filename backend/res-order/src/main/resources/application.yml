server:
  port: 8095

spring:
  application:
    name: order
  jackson:
    default-property-inclusion: non_null
  profiles:
    active: dev
  cloud:
    nacos:
      config:
        refresh-enabled: true
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yml
        import-check:
          enabled: false
  config:
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}?refreshEnabled=true
      - optional:nacos:dataSource.${spring.cloud.nacos.config.file-extension}?refreshEnabled=true
      - optional:nacos:mybatisPlus.${spring.cloud.nacos.config.file-extension}?refreshEnabled=true
      - optional:nacos:openFeign.${spring.cloud.nacos.config.file-extension}?refreshEnabled=true
      - optional:nacos:rabbitmq-yml?refreshEnabled=true
      - optional:nacos:redis-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}?refreshEnabled=true
      # ★ 支付宝密钥从 Nacos 配置中心加载，不在源码中硬编码
      - optional:nacos:alipay-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}?refreshEnabled=true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# ============================================================
# 支付宝配置说明：
#   appId / privateKey / alipayPublicKey 为敏感信息，
#   不在此文件中硬编码，而是通过 Nacos 配置中心加载。
#
#   Nacos 中需要创建 Data ID: alipay-dev.yml, Group: DEFAULT_GROUP
#   内容格式如下（仅包含敏感字段）：
#   ┌─────────────────────────────────────────────┐
#   │ alipay:                                      │
#   │   appId: 9021000166673656                    │
#   │   privateKey: MIIEvAIBADANBgkqhkiG9w0B...    │
#   │   alipayPublicKey: MIIBIjANBgkqhkiG9w0B...   │
#   └─────────────────────────────────────────────┘
#
#   本地开发时，也可通过环境变量覆盖（优先级：环境变量 > Nacos > yml默认值）：
#     ALIPAY_APP_ID=9021000166673656
#     ALIPAY_PRIVATE_KEY=MIIEvAIBADANBgkqhkiG9w0B...
#     ALIPAY_ALIPAY_PUBLIC_KEY=MIIBIjANBgkqhkiG9w0B...
# ============================================================
alipay:
  # 敏感字段：优先从 Nacos 或环境变量读取，此处为空默认值
  appId: ${ALIPAY_APP_ID:}
  privateKey: ${ALIPAY_PRIVATE_KEY:}
  alipayPublicKey: ${ALIPAY_ALIPAY_PUBLIC_KEY:}
  # 以下为非敏感配置，可直接硬编码
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  notify-url: http://ga8d9a76.natappfree.cc/order/alipay/notify
  return-url: http://localhost:5173/order
  sign-type: RSA2
  charset: UTF-8
  format: json

test:
  payment:
    enabled: false

